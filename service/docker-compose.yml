# The caderno search service. Run from this folder: `docker compose up -d`.
# Settings come from .env (copy .env.example).
name: caderno

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: caderno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: caderno
    volumes:
      - caderno-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caderno"]
      interval: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: service/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Run as your own user so notes the service writes are yours, not root's.
    user: "${CADERNO_UID:-1000}:${CADERNO_GID:-1000}"
    environment:
      DATABASE_URL: postgresql://caderno:${POSTGRES_PASSWORD}@db:5432/caderno
      CADERNO_TOKEN: ${CADERNO_TOKEN:-}
      CADERNO_NOTEBOOK_PATH: /notebook
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}
      EMBED_URL: ${EMBED_URL:-http://host.docker.internal:11434}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_BATCH: ${EMBED_BATCH:-32}
      REINDEX_SECONDS: ${REINDEX_SECONDS:-300}
      DUPLICATE_THRESHOLD: ${DUPLICATE_THRESHOLD:-0.82}
    volumes:
      - ${CADERNO_NOTEBOOK:?set CADERNO_NOTEBOOK in .env}:/notebook
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Localhost only by default. To reach it from other machines set
      # CADERNO_BIND=0.0.0.0, and only over a private network (see README).
      - "${CADERNO_BIND:-127.0.0.1}:${CADERNO_PORT:-8420}:8420"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8420/health').status==200 else 1)"]
      interval: 30s
      start_period: 60s

volumes:
  caderno-db:
